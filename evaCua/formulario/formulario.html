<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

</head>

<body>
  <div class="barra-lateral">
    <div class="nombre-pagina">
      <ion-icon id="cloud" name="cloud-outline"></ion-icon>
      <span>chocoflow</span>
    </div>

    <button class="boton">
      <ion-icon name="add-outline"></ion-icon>
      <span>Crear Portafolio</span>
    </button>
    <nav class="navegacion">
      <ul>
        <li>
          <a href="/evaCua/index.html">
            <ion-icon name="home-outline"></ion-icon>
            <span>Inicio</span>
          </a>
        </li>
        <li>
          <a href="/evaCua/index.html">
            <ion-icon name="file-tray-stacked-outline"></ion-icon>
            <span>Proyectos</span>
          </a>
        </li>
        <li>
          <a href="/evaCua/index.html">
            <ion-icon name="cash-outline"></ion-icon>
            <span>Skills</span>
          </a>
        </li>
        <li>
          <a href="/evaCua/formulario/formulario.html">
            <ion-icon name="settings-outline"></ion-icon>
            <span>Contacto
            </span>
          </a>
        </li>

      </ul>
    </nav>

    <div class="linea"></div>

    <div id="modo-oscuro" class="modo-oscuro">
      <div class="info">
        <ion-icon name="moon-outline"></ion-icon>
        <span>Modo oscuro</span>
      </div>
      <div class="switch">
        <div class="base">
          <div class="circulo">

          </div>
        </div>
      </div>
    </div>
  </div>
  </div>

  <main>
    <div class="banner">

    </div>
    <form action="https://formsubmit.co/jose.valenzuela.casas@vallegrande.edu.pe" method="POST" id="myForm">
      <h2>Contacto</h2>

      <div class="input-group">
        <label class="text" for="name">Nombre</label>
        <input type="text" name="name" id="name" placeholder="Nombre">

        <label class="text" for="phone">Telefono</label>
        <input type="tel" name="phone" id="phone" placeholder="Telefono">

        <label class="text"  for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="Email">

        <label class="text" for="message">Mensaje</label>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="Mensaje"></textarea>

        <input class="btn" type="submit" value="Enviar">

        <input type="hidden" name="_next" value="http://127.0.0.1:5500/formulario.html">
        <input type="hidden" name="_captcha" value="false">

        <script src="validaciones.js"></script>
      </div>

    </form>
  </main>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="/evaCua/script.js"></script>
